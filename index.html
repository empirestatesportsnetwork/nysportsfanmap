<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Empire State Sports Fan Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #17171a;
    --ink-soft: #6b6a66;
    --border: #e6e4dd;
    --accent: #17171a;
    --tie: #111111;
    --no-data: #e4e2dc;
    --shadow: 0 4px 20px rgba(20, 20, 18, 0.07);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; height: 100vh; overflow: hidden; }

  .top-panel {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1000;
    width: fit-content;
    background: var(--panel);
    box-shadow: var(--shadow);
    border-bottom-right-radius: 12px;
    overflow: hidden;
  }

  header {
    padding: 18px 24px 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .header-titles { min-width: 0; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.015em;
  }

  .byline {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .byline-dot { font-size: 10px; }
  .byline-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    transition: color .12s ease;
  }
  .byline-x:hover { color: var(--ink); }
  .byline-x svg { width: 13px; height: 13px; }

  .search-bar {
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .search-group {
    display: flex;
    gap: 8px;
  }
  .search-box { position: relative; width: 168px; }
  .search-box input {
    width: 100%;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #f6f5f2;
    color: var(--ink);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .search-box input::placeholder { color: #a3a19a; }
  .search-box input:focus { border-color: var(--ink); background: #fff; }
  .search-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    max-height: 240px;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px 6px 4px 0;
    z-index: 900;
    scrollbar-width: thin; /* Firefox */
    scrollbar-color: #d4d2ca transparent; /* Firefox */
  }
  .search-dropdown::-webkit-scrollbar {
    width: 8px;
  }
  .search-dropdown::-webkit-scrollbar-track {
    background: transparent;
    margin: 6px 0; /* keeps the track clear of the rounded top/bottom corners */
  }
  .search-dropdown::-webkit-scrollbar-thumb {
    background: #d4d2ca;
    border-radius: 20px;
    border: 2px solid #fff; /* creates the inset/rounded look against the track */
  }
  .search-dropdown::-webkit-scrollbar-thumb:hover {
    background: #b8b6ac;
  }
  .search-dropdown.open { display: block; }
  .search-option {
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .search-option:hover, .search-option.highlighted { background: #f2f1ec; }
  .search-empty {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .form-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    padding: 9px 15px;
    border-radius: 7px;
    box-shadow: var(--shadow);
    transition: transform .12s ease, opacity .12s ease;
    white-space: nowrap;
    margin-top: 14px;
  }
  .form-link:hover { opacity: 0.88; transform: translateY(-1px); }
  .form-link svg { width: 12px; height: 12px; }

  .tabs {
    display: inline-flex;
    gap: 2px;
    margin-top: 16px;
    background: #efeee9;
    padding: 3px;
    border-radius: 9px;
  }
  .tab {
    padding: 7px 16px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    color: #fff;
    background: var(--ink);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .toolbar .status { flex: 1; }

  main { position: absolute; inset: 0; }
  #map { position: absolute; inset: 0; }

  .legend {
    position: absolute;
    bottom: 22px;
    left: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 15px;
    font-size: 12px;
    max-width: 230px;
    max-height: 45vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    z-index: 500;
    scrollbar-width: thin;
    scrollbar-color: #d4d2ca transparent;
  }
  .legend::-webkit-scrollbar { width: 8px; }
  .legend::-webkit-scrollbar-track { background: transparent; margin: 8px 0; }
  .legend::-webkit-scrollbar-thumb {
    background: #d4d2ca;
    border-radius: 20px;
    border: 2px solid #fff;
  }
  .legend::-webkit-scrollbar-thumb:hover { background: #b8b6ac; }
  .legend h3 {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 8px 0;
    font-weight: 700;
  }
  .legend-total {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    padding-bottom: 7px;
    margin-bottom: 5px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    font-weight: 500;
  }
  .swatch {
    width: 11px; height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.12);
  }
  .legend-row .name { flex: 1; }
  .legend-row .count {
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
  }

  .underrep-panel {
    position: absolute;
    bottom: 22px;
    right: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 12px;
    max-width: 230px;
    z-index: 500;
    overflow: hidden;
  }
  .underrep-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 14px;
    cursor: pointer;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
  }
  .underrep-chevron {
    font-size: 9px;
    color: var(--ink-soft);
    transition: transform .15s ease;
  }
  .underrep-panel.collapsed .underrep-chevron { transform: rotate(180deg); }
  .underrep-panel.collapsed .underrep-body { display: none; }
  .underrep-body {
    padding: 0 14px 12px 14px;
    max-height: 38vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #d4d2ca transparent;
  }
  .underrep-body::-webkit-scrollbar { width: 8px; }
  .underrep-body::-webkit-scrollbar-track { background: transparent; margin: 4px 0; }
  .underrep-body::-webkit-scrollbar-thumb {
    background: #d4d2ca;
    border-radius: 20px;
    border: 2px solid #fff;
  }
  .underrep-body::-webkit-scrollbar-thumb:hover { background: #b8b6ac; }
  .underrep-lead {
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .underrep-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
    font-weight: 500;
  }
  .underrep-row:first-child { border-top: none; }
  .underrep-row:hover .underrep-name { text-decoration: underline; }
  .underrep-row .underrep-count {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    color: #fff;
    background: var(--ink-soft);
    padding: 1px 7px;
    border-radius: 20px;
  }
  .underrep-row.zero .underrep-count { background: #b3261e; }
  .underrep-cta {
    display: block;
    margin-top: 10px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    background: var(--ink);
    padding: 8px 0;
    border-radius: 6px;
    text-decoration: none;
  }
  .underrep-cta:hover { opacity: 0.88; }

  .outside-ny-mask {
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .leaflet-tooltip.county-tip {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    font-family: "IBM Plex Sans", sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  .leaflet-tooltip.county-tip::before { display: none; }
  .tip-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    margin-bottom: 5px;
    font-size: 13px;
    letter-spacing: -0.01em;
  }
  .tip-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    color: #cfcfcf;
    padding: 1px 0;
  }
  .tip-row.winner { color: #fff; font-weight: 700; }
  .tip-tied { color: #f2b134; font-weight: 700; margin-top: 3px; }
  .tip-hint { color: #8a8a8a; font-size: 10px; margin-top: 6px; font-weight: 500; }

  .empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    z-index: 400;
    background: var(--panel);
    padding: 20px 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">
  <div class="top-panel">
    <header>
      <div class="header-titles">
        <h1>The Empire State Sports Fan Map</h1>
        <div class="byline">
          <span class="byline-dot">&bull;</span>
          <span>by the Empire State Sports Network</span>
          <a class="byline-x" href="https://x.com/essnnetwork" target="_blank" rel="noopener noreferrer" aria-label="@essnnetwork on X">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-league="NFL">NFL</button>
          <button class="tab" data-league="NBA">NBA</button>
          <button class="tab" data-league="MLB">MLB</button>
          <button class="tab" data-league="NHL">NHL</button>
        </div>
        <a class="form-link" href="https://forms.gle/AZuSEtA5LhPoBS5v6" target="_blank" rel="noopener noreferrer">
          Fill out the form
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </a>
      </div>
    </header>
    <div class="search-bar">
      <div class="search-group">
        <div class="search-box">
          <input type="text" id="county-search" placeholder="Search a county&hellip;" autocomplete="off" />
          <div class="search-dropdown" id="county-dropdown"></div>
        </div>
        <div class="search-box">
          <input type="text" id="city-search" placeholder="Search a city/town&hellip;" autocomplete="off" />
          <div class="search-dropdown" id="city-dropdown"></div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="status" id="status">Loading data&hellip;</div>
    </div>
  </div>
  <main>
    <div id="map"></div>
    <div class="legend" id="legend" style="display:none;">
      <h3 id="legend-title">NFL</h3>
      <div id="legend-body"></div>
    </div>
    <div class="underrep-panel" id="underrep-panel">
      <div class="underrep-header" id="underrep-toggle">
        <span id="underrep-title">Needs more data</span>
        <span class="underrep-chevron" id="underrep-chevron">&#9650;</span>
      </div>
      <div class="underrep-body" id="underrep-body"></div>
    </div>
  </main>
</div>

<script>
function renderUnderrepresented() {
  const bodyEl = document.getElementById("underrep-body");
  const allCounties = NY_COUNTIES_GEOJSON.features.map(f => f.properties.name);

  const withCounts = allCounties.map(name => ({
    name,
    count: COUNTY_TOTALS[name] || 0
  }));
  withCounts.sort((a, b) => a.count - b.count || a.name.localeCompare(b.name));

  const zeroCount = withCounts.filter(c => c.count === 0).length;
  const shortlist = withCounts; // show all 62 counties, ranked lowest-coverage first (scrollable)

  const lead = zeroCount > 0
    ? `${zeroCount} of 62 counties have zero responses so far. All counties, lowest coverage first:`
    : `Every county has at least one response. All counties, lowest coverage first:`;

  const rows = shortlist.map(c => `
    <div class="underrep-row ${c.count === 0 ? "zero" : ""}" data-county="${c.name}">
      <span class="underrep-name">${c.name}</span>
      <span class="underrep-count">${c.count}</span>
    </div>
  `).join("");

  bodyEl.innerHTML = `
    <div class="underrep-lead">${lead}</div>
    ${rows}
    <a class="underrep-cta" href="https://forms.gle/AZuSEtA5LhPoBS5v6" target="_blank" rel="noopener noreferrer">Share the form</a>
  `;

  bodyEl.querySelectorAll(".underrep-row").forEach(row => {
    row.addEventListener("click", () => {
      const name = row.dataset.county;
      const layer = COUNTY_LAYERS[name];
      if (layer) {
        map.fitBounds(layer.getBounds(), { maxZoom: 9, padding: [40, 40] });
        pinCounty(layer.feature, layer);
      }
    });
  });
}

document.getElementById("underrep-toggle").addEventListener("click", () => {
  document.getElementById("underrep-panel").classList.toggle("collapsed");
});

/* ---------- Cross-league summary (used by search results) ---------- */
function crossLeagueSummaryHtml(name, dataByLeague) {
  const leagues = ["NFL", "NBA", "MLB", "NHL"];
  const rows = leagues.map(league => {
    const rec = dataByLeague[league] && dataByLeague[league][name];
    if (!rec) return `<div class="tip-row"><span>${league}</span><span>No data</span></div>`;
    return `<div class="tip-row winner"><span>${league}: ${rec.winner}${rec.tied ? " (tie)" : ""}</span><span>${rec.counts[rec.winner]}</span></div>`;
  }).join("");
  return `<div class="tip-title">${name}</div>${rows}`;
}

/* ---------- Generic searchable dropdown ---------- */
function setupSearch({ inputId, dropdownId, options, onSelect }) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  let highlighted = -1;
  let filtered = [];

  function render(query) {
    const q = query.trim().toLowerCase();
    filtered = q === ""
      ? options.slice()
      : options.filter(o => o.toLowerCase().includes(q));
    highlighted = -1;

    if (!filtered.length) {
      dropdown.innerHTML = `<div class="search-empty">No matches with data yet</div>`;
    } else {
      dropdown.innerHTML = filtered.map((o, i) =>
        `<div class="search-option" data-idx="${i}">${o}</div>`
      ).join("");
    }
    dropdown.classList.add("open");
  }

  input.addEventListener("focus", () => render(input.value));
  input.addEventListener("input", () => render(input.value));
  input.addEventListener("blur", () => {
    // slight delay so a click on an option registers before the dropdown closes
    setTimeout(() => dropdown.classList.remove("open"), 150);
  });
  input.addEventListener("keydown", (e) => {
    if (!dropdown.classList.contains("open") || !filtered.length) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      highlighted = Math.min(highlighted + 1, filtered.length - 1);
      updateHighlight();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      highlighted = Math.max(highlighted - 1, 0);
      updateHighlight();
    } else if (e.key === "Enter" && highlighted >= 0) {
      e.preventDefault();
      select(filtered[highlighted]);
    } else if (e.key === "Escape") {
      dropdown.classList.remove("open");
    }
  });

  function updateHighlight() {
    dropdown.querySelectorAll(".search-option").forEach((el, i) => {
      el.classList.toggle("highlighted", i === highlighted);
    });
  }

  function select(value) {
    input.value = value;
    dropdown.classList.remove("open");
    onSelect(value);
  }

  dropdown.addEventListener("mousedown", (e) => {
    const opt = e.target.closest(".search-option");
    if (opt) select(filtered[Number(opt.dataset.idx)]);
  });
}

let cityMarker = null;

/* ---------- Deep linking: read/write ?league=&county=&city= in the URL ---------- */
function getURLParams() {
  return new URLSearchParams(window.location.search);
}
function updateURLParams(updates) {
  const params = getURLParams();
  for (const [key, value] of Object.entries(updates)) {
    if (value === null || value === undefined) {
      params.delete(key);
    } else {
      params.set(key, value);
    }
  }
  const newSearch = params.toString();
  const newURL = window.location.pathname + (newSearch ? `?${newSearch}` : "") + window.location.hash;
  window.history.replaceState({}, "", newURL);
}
/* Case-insensitive match against a list of valid names, since a hand-typed
   or hand-edited URL might not match capitalization exactly. */
function findMatchingName(rawValue, validNames) {
  if (!rawValue) return null;
  const target = rawValue.trim().toLowerCase();
  return validNames.find(n => n.toLowerCase() === target) || null;
}

function selectSearchedCounty(name) {
  const layer = COUNTY_LAYERS[name];
  if (!layer) return;
  if (cityMarker) { map.removeLayer(cityMarker); cityMarker = null; }
  map.fitBounds(layer.getBounds(), { maxZoom: 9, padding: [40, 40] });

  if (pinnedLayer && pinnedLayer !== layer) unpinCounty();
  layer.unbindTooltip();
  layer.bindTooltip(crossLeagueSummaryHtml(name, leagueData) + `<div class="tip-hint">tap map to close</div>`, {
    className: "county-tip",
    permanent: true,
    direction: "top",
    sticky: false
  });
  layer.openTooltip();
  layer.setStyle({ weight: 2.5, color: "#000" });
  layer.bringToFront();
  pinnedLayer = layer;
  pinnedCounty = name;

  updateURLParams({ county: name, city: null });
  const countyInput = document.getElementById("county-search");
  if (countyInput) countyInput.value = name;
}

function selectSearchedCity(name) {
  unpinCounty();
  if (cityMarker) { map.removeLayer(cityMarker); cityMarker = null; }

  const coords = CITY_COORDS[name];
  if (!coords) return;

  cityMarker = L.circleMarker(coords, {
    radius: 7,
    color: "#fff",
    weight: 2,
    fillColor: "#111111",
    fillOpacity: 1
  }).addTo(map);

  cityMarker.bindTooltip(crossLeagueSummaryHtml(name, cityData) + `<div class="tip-hint">tap map to close</div>`, {
    className: "county-tip",
    permanent: true,
    direction: "top",
    sticky: false
  });

  map.flyTo(coords, 10.5);
  cityMarker.openTooltip();

  updateURLParams({ city: name, county: null });
  const cityInput = document.getElementById("city-search");
  if (cityInput) cityInput.value = name;

/* ---------- CSV parsing (same logic as build-league-data.js) ---------- */
const LEAGUE_COLUMNS = { NFL: "NFL", NBA: "NBA", MLB: "MLB", NHL: "NHL" };
const COUNTY_COLUMN = "County";

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    const next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (field !== "" || row.length) {
          row.push(field); rows.push(row); row = []; field = "";
        }
        if (c === "\r" && next === "\n") i++;
      } else { field += c; }
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const headers = rows.shift().map(h => h.trim());
  return rows
    .filter(r => r.length === headers.length && r.some(v => v !== ""))
    .map(r => Object.fromEntries(headers.map((h, i) => [h, r[i].trim()])));
}

/* ---------- New York tie-break priority ---------- */
/* When two teams are tied for a county/city, the NY-based team should be
   listed/treated as the winner over an out-of-state team. */
const NY_TEAMS = {
  NFL: new Set(["Bills", "Giants", "Jets"]),
  NBA: new Set(["Knicks", "Nets"]),
  MLB: new Set(["Yankees", "Mets"]),
  NHL: new Set(["Sabres", "Rangers", "Islanders"])
};

function sortWithNYPriority(entries, league) {
  const nySet = NY_TEAMS[league] || new Set();
  return entries.slice().sort((a, b) => {
    if (b[1] !== a[1]) return b[1] - a[1]; // higher count first
    const aNY = nySet.has(a[0]) ? 1 : 0;
    const bNY = nySet.has(b[0]) ? 1 : 0;
    return bNY - aNY; // among ties, NY team first
  });
}

function aggregate(rows, groupColumn = COUNTY_COLUMN) {
  const result = {};
  for (const league of Object.keys(LEAGUE_COLUMNS)) result[league] = {};

  for (const row of rows) {
    const key = row[groupColumn];
    if (!key) continue;
    for (const [league, column] of Object.entries(LEAGUE_COLUMNS)) {
      const team = row[column];
      if (!team || team.toLowerCase() === "none") continue;
      if (!result[league][key]) result[league][key] = { counts: {}, total: 0 };
      const bucket = result[league][key];
      bucket.counts[team] = (bucket.counts[team] || 0) + 1;
      bucket.total += 1;
    }
  }

  for (const league of Object.keys(result)) {
    for (const key of Object.keys(result[league])) {
      const { counts } = result[league][key];
      const entries = sortWithNYPriority(Object.entries(counts), league);
      const topCount = entries[0][1];
      const tied = entries.filter(([, c]) => c === topCount).length > 1;
      result[league][key].winner = entries[0][0];
      result[league][key].tied = tied;
      result[league][key].share = topCount / result[league][key].total;
    }
  }
  return result;
}

/* Blur/dim everything outside New York State: a single polygon shaped like
   a giant box with the state's real outline (mainland + islands) cut out as
   holes. backdrop-filter blurs the basemap tiles showing through the mask;

/* ---------- Styling logic ---------- */
function colorForCounty(league, countyName) {
  const rec = leagueData && leagueData[league] && leagueData[league][countyName];
  if (!rec) return { fill: NO_DATA_COLOR, opacity: 0.55, hasData: false };
  if (rec.tied) return { fill: TIE_COLOR, opacity: 0.75, hasData: true };
  const base = (TEAM_COLORS[league] && TEAM_COLORS[league][rec.winner]) || FALLBACK_COLOR;
  const opacity = 0.32 + 0.62 * rec.share; // weaker plurality -> lighter, near-unanimous -> fully saturated
  return { fill: base, opacity, hasData: true };
}

function styleFeature(feature) {
  const name = feature.properties.name;
  const { fill, opacity } = colorForCounty(activeLeague, name);
  return {
    fillColor: fill,
    fillOpacity: opacity,
    color: "#ffffff",
    weight: 1,
    opacity: 1
  };
}

function tooltipHtml(name) {
  const rec = leagueData && leagueData[activeLeague] && leagueData[activeLeague][name];
  if (!rec) {
    return `<div class="tip-title">${name} County</div><div class="tip-row">No responses yet</div>`;
  }
  const entries = sortWithNYPriority(Object.entries(rec.counts), activeLeague);
  let rowsHtml = entries.slice(0, 5).map(([team, count], i) => {
    const pct = Math.round((count / rec.total) * 100);
    const cls = i === 0 ? "winner" : "";
    return `<div class="tip-row ${cls}"><span>${team}</span><span>${count} (${pct}%)</span></div>`;
  }).join("");
  const tieNote = rec.tied ? `<div class="tip-tied">Exact tie</div>` : "";
  return `<div class="tip-title">${name} County</div>${rowsHtml}${tieNote}
    <div class="tip-row" style="margin-top:4px;color:#999;">n = ${rec.total}</div>`;
}

function unpinCounty() {
  if (!pinnedLayer) return;
  pinnedLayer.closeTooltip();
  pinnedLayer.unbindTooltip();
  pinnedLayer.bindTooltip("", { className: "county-tip", sticky: true });
  pinnedLayer.setStyle({ weight: 1, color: "#ffffff" });
  pinnedLayer = null;
  pinnedCounty = null;
}

function pinCounty(feature, layer) {
  if (pinnedLayer && pinnedLayer !== layer) unpinCounty();

  if (pinnedLayer === layer) {
    // tapping/clicking the already-pinned county again unpins it
    unpinCounty();
    return;
  }

  const name = feature.properties.name;
  layer.unbindTooltip();
  layer.bindTooltip(tooltipHtml(name) + `<div class="tip-hint">tap again to close</div>`, {
    className: "county-tip",
    permanent: true,
    direction: "top",
    sticky: false
  });
  layer.openTooltip();
  layer.setStyle({ weight: 2.5, color: "#000" });
  layer.bringToFront();
  pinnedLayer = layer;
  pinnedCounty = name;
}

function onEachFeature(feature, layer) {
  const name = feature.properties.name;
  COUNTY_LAYERS[name] = layer;
  layer.bindTooltip("", { className: "county-tip", sticky: true });
  layer.on({
    mouseover: (e) => {
      if (pinnedLayer === layer) return; // already pinned open, leave it alone
      layer.setTooltipContent(tooltipHtml(name));
      layer.setStyle({ weight: 2.5, color: "#000" });
      layer.bringToFront();
    },
    mouseout: () => {
      if (pinnedLayer === layer) return; // keep pinned county highlighted
      layer.setStyle({ weight: 1, color: "#ffffff" });
    },
    click: (e) => {
      L.DomEvent.stopPropagation(e); // don't let the map's own click handler unpin us immediately
      pinCounty(feature, layer);
    }
  });
}

function renderLegend() {
  const legendEl = document.getElementById("legend");
  const bodyEl = document.getElementById("legend-body");
  document.getElementById("legend-title").textContent = activeLeague;

  if (!leagueData || !leagueData[activeLeague]) {
    legendEl.style.display = "none";
    return;
  }
  const totals = {};
  let leagueTotal = 0;
  for (const county of Object.values(leagueData[activeLeague])) {
    leagueTotal += county.total;
    if (county.tied) continue;
    totals[county.winner] = (totals[county.winner] || 0) + county.counts[county.winner];
  }
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) { legendEl.style.display = "none"; return; }

  const totalLine = `<div class="legend-total">${leagueTotal} ${activeLeague} responses (excl. "None")</div>`;

  bodyEl.innerHTML = totalLine + sorted.map(([team, count]) => {
    const color = (TEAM_COLORS[activeLeague] && TEAM_COLORS[activeLeague][team]) || FALLBACK_COLOR;
    return `<div class="legend-row">
      <div class="swatch" style="background:${color}"></div>
      <div class="name">${team}</div>
      <div class="count">${count}</div>
    </div>`;
  }).join("") + `<div class="legend-row" style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
      <div class="swatch" style="background:${TIE_COLOR}"></div><div class="name">Exact tie</div>
    </div>
    <div class="legend-row">
      <div class="swatch" style="background:${NO_DATA_COLOR}"></div><div class="name">No data yet</div>
    </div>`;

  legendEl.style.display = "block";
}

function renderMap() {
  if (geoLayer) map.removeLayer(geoLayer);
  COUNTY_LAYERS = {};
  pinnedLayer = null;
  pinnedCounty = null;
  geoLayer = L.geoJSON(NY_COUNTIES_GEOJSON, { style: styleFeature, onEachFeature }).addTo(map);
  renderLegend();
  renderUnderrepresented();
}

function updateStatus() {
  const statusEl = document.getElementById("status");
  const countiesWithData = new Set();
  for (const league of Object.keys(leagueData)) {
    for (const county of Object.keys(leagueData[league])) {
      countiesWithData.add(county);
    }
  }
  statusEl.textContent = `${TOTAL_RESPONSES} responses collected · ${countiesWithData.size} of 62 counties have data.`;
}

/* ---------- Tabs ---------- */
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  activeLeague = btn.dataset.league;
  renderMap();
  updateURLParams({ league: activeLeague });
});

/* ---------- Load baked-in CSV on startup ---------- */
/* Data is embedded directly in this file (see APPROVED_CSV below) — there is
   no upload control, so the page always shows exactly this dataset. To update
   the map, regenerate this file with a fresh CSV export. */
(function init() {
  const rows = parseCSV(APPROVED_CSV);
  TOTAL_RESPONSES = rows.length;
  leagueData = aggregate(rows, COUNTY_COLUMN);
  cityData = aggregate(rows, LOCAL_COLUMN);

  COUNTY_TOTALS = {};
  const cityTotals = {};
  for (const row of rows) {
    const county = row[COUNTY_COLUMN];
    if (county) COUNTY_TOTALS[county] = (COUNTY_TOTALS[county] || 0) + 1;
    const city = row[LOCAL_COLUMN];
    if (city) cityTotals[city] = (cityTotals[city] || 0) + 1;
  }

  // Combined "New York City" entry: merge all five-borough rows into one
  // virtual city so it's searchable as a single option alongside boroughs.
  const nycRows = rows
    .filter(row => BOROUGH_ALIASES.has(row[LOCAL_COLUMN]))
    .map(row => ({ ...row, [LOCAL_COLUMN]: NYC_LABEL }));
  if (nycRows.length) {
    const nycAggregate = aggregate(nycRows, LOCAL_COLUMN);
    for (const league of Object.keys(nycAggregate)) {
      if (nycAggregate[league][NYC_LABEL]) {
        cityData[league][NYC_LABEL] = nycAggregate[league][NYC_LABEL];
      }
    }
    cityTotals[NYC_LABEL] = nycRows.length;
  }

  updateStatus();
  renderMap();

  setupSearch({
    inputId: "county-search",
    dropdownId: "county-dropdown",
    options: Object.keys(COUNTY_TOTALS).sort(),
    onSelect: selectSearchedCounty
  });

  setupSearch({
    inputId: "city-search",
    dropdownId: "city-dropdown",
    options: Object.keys(cityTotals).filter(name => CITY_COORDS[name]).sort(),
    onSelect: selectSearchedCity
  });

  // Deep linking: apply ?league=&county=&city= from the URL, if present and valid.
  // Lets a shared link (e.g. from a subreddit post) open directly on a specific
  // county or city instead of the default statewide view.
  const urlParams = getURLParams();
  const urlLeague = urlParams.get("league");
  if (urlLeague && LEAGUE_COLUMNS[urlLeague.toUpperCase()]) {
    const league = urlLeague.toUpperCase();
    activeLeague = league;
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.toggle("active", t.dataset.league === league);
    });
    renderMap();
  }

  const urlCounty = findMatchingName(urlParams.get("county"), Object.keys(COUNTY_TOTALS));
  const urlCity = findMatchingName(urlParams.get("city"), Object.keys(cityTotals).filter(n => CITY_COORDS[n]));
  if (urlCounty) {
    selectSearchedCounty(urlCounty);
  } else if (urlCity) {
    selectSearchedCity(urlCity);
  }
})();
</script>
</body>
